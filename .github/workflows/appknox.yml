name: Appknox
'on':
  workflow_dispatch:
    inputs:
      apk_url:
        description: URL HTTPS del APK firmado de NOVORA LinkEngine que se desea analizar
        required: true
      risk_threshold:
        description: Severidad mÃƒÆ’Ã‚Â­nima que hace fallar el anÃƒÆ’Ã‚Â¡lisis
        required: true
        default: HIGH
        type: choice
        options:
        - CRITICAL
        - HIGH
        - MEDIUM
        - LOW
permissions:
  contents: read
jobs:
  appknox:
    name: Appknox APK Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      APPKNOX_ACCESS_TOKEN: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
      APK_URL: ${{ inputs.apk_url }}
    steps:
    - name: Verify configuration
      shell: bash
      run: "if [ -z \"$APPKNOX_ACCESS_TOKEN\" ]; then\n  echo \"Configura APPKNOX_ACCESS_TOKEN como GitHub Secret.\" >&2\n\
        \  exit 1\nfi\n\ncase \"$APK_URL\" in\n  https://*) ;;\n  *) echo \"apk_url debe usar HTTPS.\" >&2; exit 1 ;;\nesac\n"
    - name: Download APK
      shell: bash
      run: "curl --fail --location --proto '=https' --tlsv1.2 \\\n  \"$APK_URL\" \\\n  --output novora-linkengine.apk\n\n\
        test -s novora-linkengine.apk\n"
    - name: Appknox scan
      uses: appknox/appknox-github-action@13f49a986fc0f12e103650ab36a35334f02969af # 1.2.1
      with:
        appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
        file_path: novora-linkengine.apk
        risk_threshold: ${{ inputs.risk_threshold }}
        sarif: Enable
    - name: Upload SARIF
      if: always() && hashFiles('report.sarif') != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: report.sarif
