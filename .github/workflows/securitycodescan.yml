name: SecurityCodeScan

on:
  push:
    branches:
      - NOVORA-LINK
      - "release/**"
  pull_request:
    branches:
      - NOVORA-LINK
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-code-scan:
    name: SecurityCodeScan
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore verified runtime tools
        shell: pwsh
        run: .\scripts\Setup-Tools.ps1

      - name: Add SecurityCodeScan analyzer to CI workspace
        shell: pwsh
        run: |
          $project = ".\src\NOVORA\NOVORA.csproj"
          $listed = dotnet list $project package

          if ($listed -notmatch "SecurityCodeScan\.VS2019") {
              dotnet add $project package SecurityCodeScan.VS2019 --version 5.6.7
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore .\NOVORA.sln

      - name: Analyze and emit SARIF 2.1
        shell: pwsh
        run: |
          $rawSarif = "${{ github.workspace }}\securitycodescan-raw.sarif"

          dotnet build .\src\NOVORA\NOVORA.csproj `
            -c Release `
            --no-restore `
            "-p:ErrorLog=$rawSarif,version=2.1"

          if ($LASTEXITCODE -ne 0) {
              throw "SecurityCodeScan build terminó con código $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath $rawSarif -PathType Leaf)) {
              throw "SecurityCodeScan no generó el archivo SARIF."
          }

          $document = Get-Content -LiteralPath $rawSarif -Raw | ConvertFrom-Json

          if ($document.version -ne "2.1.0") {
              throw "SARIF inválido para GitHub Code Scanning. Esperado 2.1.0, obtenido: $($document.version)"
          }

      - name: Filter SecurityCodeScan findings
        shell: pwsh
        run: |
          $rawSarif = "${{ github.workspace }}\securitycodescan-raw.sarif"
          $filteredSarif = "${{ github.workspace }}\securitycodescan.sarif"
          $document = Get-Content -LiteralPath $rawSarif -Raw | ConvertFrom-Json
          $total = 0

          foreach ($run in @($document.runs)) {
              $securityResults = @(
                  @($run.results) |
                  Where-Object {
                      -not [string]::IsNullOrWhiteSpace($_.ruleId) -and
                      $_.ruleId -match '^SCS\d+$'
                  }
              )

              $run.results = $securityResults
              $total += $securityResults.Count

              $referencedRuleIds = [System.Collections.Generic.HashSet[string]]::new(
                  [System.StringComparer]::OrdinalIgnoreCase
              )

              foreach ($result in $securityResults) {
                  [void]$referencedRuleIds.Add([string]$result.ruleId)
              }

              if ($null -ne $run.tool.driver.rules) {
                  $run.tool.driver.rules = @(
                      @($run.tool.driver.rules) |
                      Where-Object {
                          $referencedRuleIds.Contains([string]$_.id)
                      }
                  )
              }
          }

          if ($total -gt 25000) {
              throw "SecurityCodeScan produjo $total hallazgos SCS; excede el límite de 25,000 resultados de GitHub Code Scanning."
          }

          $document |
              ConvertTo-Json -Depth 100 |
              Set-Content -LiteralPath $filteredSarif -Encoding utf8

          $validation = Get-Content -LiteralPath $filteredSarif -Raw | ConvertFrom-Json

          if ($validation.version -ne "2.1.0") {
              throw "El SARIF filtrado perdió la versión 2.1.0."
          }

          Write-Host "SecurityCodeScan: $total hallazgos SCS listos para GitHub Code Scanning."

      - name: Upload SARIF
        if: always() && hashFiles('securitycodescan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: securitycodescan.sarif
