name: SecurityCodeScan
'on':
  push:
    branches:
    - NOVORA-LINK
    - release/**
  pull_request:
    branches:
    - NOVORA-LINK
  schedule:
  - cron: 17 6 * * 3
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  security-code-scan:
    name: SecurityCodeScan
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET 8
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x
    - name: Restore verified runtime tools
      shell: pwsh
      run: .\scripts\Setup-Tools.ps1
    - name: Add SecurityCodeScan analyzer to CI workspace
      shell: pwsh
      run: "$project = \".\\src\\NOVORA\\NLProjectDesktop.csproj\"\n$listed = dotnet list $project package\n\nif ($listed\
        \ -notmatch \"SecurityCodeScan\\.VS2019\") {\n    dotnet add $project package SecurityCodeScan.VS2019 --version 5.6.7\n\
        }\n"
    - name: Restore
      shell: pwsh
      run: 'dotnet restore src/NOVORA/NLProjectDesktop.csproj

        if ($LASTEXITCODE -ne 0) { throw "Restore failed." }'
    - name: Analyze and emit SARIF 2.1
      shell: pwsh
      run: "$rawSarif = \"${{ github.workspace }}\\securitycodescan-raw.sarif\"\n$errorLogValue = \"$rawSarif%2Cversion=2.1\"\
        \n\ndotnet build .\\src\\NOVORA\\NLProjectDesktop.csproj `\n  -c Release `\n  --no-restore `\n  \"-p:ErrorLog=$errorLogValue\"\
        \n\nif ($LASTEXITCODE -ne 0) {\n    throw \"SecurityCodeScan build terminÃƒÆ’Ã‚Â³ con cÃƒÆ’Ã‚Â³digo $LASTEXITCODE.\"\
        \n}\n\nif (-not (Test-Path -LiteralPath $rawSarif -PathType Leaf)) {\n    throw \"SecurityCodeScan no generÃƒÆ’Ã‚Â³\
        \ el archivo SARIF.\"\n}\n\n$document = Get-Content -LiteralPath $rawSarif -Raw | ConvertFrom-Json\n\nif ($document.version\
        \ -ne \"2.1.0\") {\n    throw \"SARIF invÃƒÆ’Ã‚Â¡lido para GitHub Code Scanning. Esperado 2.1.0, obtenido: $($document.version)\"\
        \n}\n"
    - name: Filter SecurityCodeScan findings
      shell: pwsh
      run: "$rawSarif = \"${{ github.workspace }}\\securitycodescan-raw.sarif\"\n$filteredSarif = \"${{ github.workspace }}\\\
        securitycodescan.sarif\"\n$document = Get-Content -LiteralPath $rawSarif -Raw | ConvertFrom-Json\n$total = 0\n\nforeach\
        \ ($run in @($document.runs)) {\n    $securityResults = @(\n        @($run.results) |\n        Where-Object {\n  \
        \          -not [string]::IsNullOrWhiteSpace($_.ruleId) -and\n            $_.ruleId -match '^SCS\\d+$'\n        }\n\
        \    )\n\n    $run.results = $securityResults\n    $total += $securityResults.Count\n\n    $referencedRuleIds = [System.Collections.Generic.HashSet[string]]::new(\n\
        \        [System.StringComparer]::OrdinalIgnoreCase\n    )\n\n    foreach ($result in $securityResults) {\n      \
        \  [void]$referencedRuleIds.Add([string]$result.ruleId)\n    }\n\n    if ($null -ne $run.tool.driver.rules) {\n  \
        \      $run.tool.driver.rules = @(\n            @($run.tool.driver.rules) |\n            Where-Object {\n        \
        \        $referencedRuleIds.Contains([string]$_.id)\n            }\n        )\n    }\n}\n\nif ($total -gt 25000) {\n\
        \    throw \"SecurityCodeScan produjo $total hallazgos SCS; excede el lÃƒÆ’Ã‚Â­mite de 25,000 resultados de GitHub\
        \ Code Scanning.\"\n}\n\n$document |\n    ConvertTo-Json -Depth 100 |\n    Set-Content -LiteralPath $filteredSarif\
        \ -Encoding utf8\n\n$validation = Get-Content -LiteralPath $filteredSarif -Raw | ConvertFrom-Json\n\nif ($validation.version\
        \ -ne \"2.1.0\") {\n    throw \"El SARIF filtrado perdiÃƒÆ’Ã‚Â³ la versiÃƒÆ’Ã‚Â³n 2.1.0.\"\n}\n\nWrite-Host \"SecurityCodeScan:\
        \ $total hallazgos SCS listos para GitHub Code Scanning.\"\n"
    - name: Upload SARIF
      if: always() && hashFiles('securitycodescan.sarif') != ''
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: securitycodescan.sarif
