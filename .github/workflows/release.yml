name: NOVORA Release
'on':
  push:
    tags:
    - v*.*
  workflow_dispatch:
    inputs:
      version:
        description: New Windows version (for example 1.4.1)
        required: true
        type: string
      android_release_tag:
        description: Existing signed LINK Control release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NOVORA_VERSIONES_DIR: ${{ github.workspace }}/Versiones
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET 8 and 10
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x

          10.0.x

          '
    - name: Resolve version and signed Android release
      shell: pwsh
      run: '$version = $env:REQUESTED_VERSION

        if ($env:GITHUB_REF_TYPE -eq ''tag'') { $version = $env:GITHUB_REF_NAME.TrimStart(''v'') }

        if ($version -notmatch ''^\d+\.\d+(?:\.\d+)?$'') { throw ''Provide a numeric Windows version.'' }

        $tag = $env:ANDROID_RELEASE_TAG

        if ([string]::IsNullOrWhiteSpace($tag)) { throw ''Set LINK_CONTROL_RELEASE_TAG or provide android_release_tag.'' }

        if ($tag -notmatch ''^v\d+\.\d+\.\d+$'') { throw ''Invalid LINK Control release tag.'' }

        "VERSION=$version" >> $env:GITHUB_ENV

        "ANDROID_TAG=$tag" >> $env:GITHUB_ENV'
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        ANDROID_RELEASE_TAG: ${{ inputs.android_release_tag || vars.LINK_CONTROL_RELEASE_TAG }}
    - name: Download existing signed LINK Control package
      shell: pwsh
      run: "if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {\n    throw 'Configure APPCONTROL_RELEASE_TOKEN with read access\
        \ to the private NOVORA-AppControl repository.'\n}\n$destination = 'src/NOVORA/Android'\ngh release download $env:ANDROID_TAG\
        \ --repo aroonvaldes-star/NOVORA-AppControl --dir $destination --clobber --pattern NLAndroidApp.apk --pattern NLAndroidRelease.json\n\
        if ($LASTEXITCODE -ne 0) { throw 'Signed Android release download failed.' }\n$descriptor = Get-Content \"$destination/NLAndroidRelease.json\"\
        \ -Raw | ConvertFrom-Json\n$hash = (Get-FileHash \"$destination/NLAndroidApp.apk\" -Algorithm SHA256).Hash\nif ($descriptor.PackageId\
        \ -ne 'com.novora.appcontrol' -or $hash -ne $descriptor.Sha256) {\n    throw 'The downloaded signed APK does not match\
        \ its descriptor.'\n}"
      env:
        GH_TOKEN: ${{ secrets.APPCONTROL_RELEASE_TOKEN }}
    - name: Verify tools
      shell: pwsh
      run: ./scripts/Setup-Tools.ps1
    - name: Build canonical relay
      shell: pwsh
      run: ./scripts/Build-LinkEngine-Relay.ps1
    - name: Publish Windows
      shell: pwsh
      run: 'dotnet publish src/NOVORA/NLProjectDesktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION
        -o "$env:NOVORA_VERSIONES_DIR/Generados/NOVORA-LINK/publish/win-x64"

        if ($LASTEXITCODE -ne 0) { throw ''Windows publish failed.'' }

        if (-not (Test-Path "$env:NOVORA_VERSIONES_DIR/Generados/NOVORA-LINK/publish/win-x64/NOVORA-LINK.exe")) { throw ''NOVORA-LINK.exe was not produced.'' }'
    - name: Prepare compliance
      shell: pwsh
      run: ./scripts/Prepare-ThirdPartyCompliance.ps1 -PublishDir "$env:NOVORA_VERSIONES_DIR/Generados/NOVORA-LINK/publish/win-x64" -OutputDir "$env:NOVORA_VERSIONES_DIR/Generados/NOVORA-LINK/compliance"
    - name: Ensure Inno Setup
      shell: pwsh
      run: "$iscc = Get-ChildItem \"${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe\" -ErrorAction SilentlyContinue\nif (-not\
        \ $iscc) {\n    choco install innosetup --yes --no-progress\n    if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation\
        \ failed.' }\n}"
    - name: Build unified installer
      shell: pwsh
      run: ./scripts/Build-UnifiedInstaller.ps1 -PublishDir "$env:NOVORA_VERSIONES_DIR/Generados/NOVORA-LINK/publish/win-x64" -ComplianceDir "$env:NOVORA_VERSIONES_DIR/Generados/NOVORA-LINK/compliance"
        -Version $env:VERSION
    - name: Upload installers from Versiones
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: NOVORA-LINK-${{ env.VERSION }}
        path: 'Versiones/Instaladores/*.exe

          Versiones/Instaladores/*.sha256'
        if-no-files-found: error
    - name: Publish tagged Windows release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: 'Versiones/Instaladores/*.exe

          Versiones/Instaladores/*.sha256'
