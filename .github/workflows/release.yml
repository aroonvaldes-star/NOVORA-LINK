name: NOVORA Release
'on':
  push:
    tags:
    - v*.*
  workflow_dispatch:
    inputs:
      version:
        description: New Windows version (for example 1.4.1)
        required: true
        type: string
      android_release_tag:
        description: Existing signed LINK Control release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET 8 and 10
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x

          10.0.x

          '
    - name: Resolve version and signed Android release
      shell: pwsh
      run: |
        $version = $env:REQUESTED_VERSION
        if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
        if ($version -notmatch '^(?<numeric>\d+\.\d+(?:\.\d+)?)(?:-(?<suffix>[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*))?$') {
            throw 'Provide a numeric Windows version with an optional pre-release suffix.'
        }
        $numeric = $Matches['numeric']
        $isPrerelease = $Matches.ContainsKey('suffix')
        $tag = $env:ANDROID_RELEASE_TAG
        if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Set LINK_CONTROL_RELEASE_TAG or provide android_release_tag.' }
        if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid LINK Control release tag.' }
        "VERSION=$version" >> $env:GITHUB_ENV
        "NUMERIC_VERSION=$numeric" >> $env:GITHUB_ENV
        "IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
        "ANDROID_TAG=$tag" >> $env:GITHUB_ENV
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        ANDROID_RELEASE_TAG: ${{ inputs.android_release_tag || 'v1.4.124' }}
    - name: Download LINK Control package from the public LINK-CONTROL releases
      shell: pwsh
      run: |
        $destination = 'src/NOVORA/Android'
        $download = Join-Path $env:RUNNER_TEMP 'link-control'
        New-Item -ItemType Directory -Force -Path $download | Out-Null
        gh release download $env:ANDROID_TAG --repo aroonvaldes-star/LINK-CONTROL --dir $download --clobber --pattern LinkControl.apk --pattern NLAndroidRelease.json
        if ($LASTEXITCODE -ne 0) { throw 'LINK Control release download failed.' }
        Copy-Item (Join-Path $download 'LinkControl.apk') "$destination/NLAndroidApp.apk" -Force
        Copy-Item (Join-Path $download 'NLAndroidRelease.json') "$destination/NLAndroidRelease.json" -Force
        $descriptor = Get-Content "$destination/NLAndroidRelease.json" -Raw | ConvertFrom-Json
        $hash = (Get-FileHash "$destination/NLAndroidApp.apk" -Algorithm SHA256).Hash
        if ($descriptor.PackageId -ne 'com.linkcontrol.novora' -or $hash -ne $descriptor.Sha256) {
            throw 'The downloaded LINK Control APK does not match its descriptor.'
        }
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Verify tools
      shell: pwsh
      run: ./scripts/Setup-Tools.ps1
    - name: Build canonical relay
      shell: pwsh
      run: ./scripts/Build-LinkEngine-Relay.ps1
    - name: Publish Windows
      shell: pwsh
      run: 'dotnet publish src/NOVORA/NLProjectDesktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:NUMERIC_VERSION
        -o artifacts/publish/win-x64

        if ($LASTEXITCODE -ne 0) { throw ''Windows publish failed.'' }

        if (-not (Test-Path artifacts/publish/win-x64/NOVORA-LINK.exe)) { throw ''NOVORA-LINK.exe was not produced.'' }'
    - name: Prepare compliance
      shell: pwsh
      run: ./scripts/Prepare-ThirdPartyCompliance.ps1 -PublishDir artifacts/publish/win-x64 -OutputDir artifacts/compliance
    - name: Ensure Inno Setup
      shell: pwsh
      run: "$iscc = Get-ChildItem \"${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe\" -ErrorAction SilentlyContinue\nif (-not\
        \ $iscc) {\n    choco install innosetup --yes --no-progress\n    if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation\
        \ failed.' }\n}"
    - name: Build unified installer
      shell: pwsh
      run: ./scripts/Build-UnifiedInstaller.ps1 -PublishDir artifacts/publish/win-x64 -ComplianceDir artifacts/compliance
        -Version $env:NUMERIC_VERSION -OutputBaseFilename "NOVORA-Setup-$env:VERSION"
    - name: Upload installer artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: NOVORA-LINK-${{ env.VERSION }}
        path: 'Installer/output/*.exe

          Installer/output/*.sha256'
        if-no-files-found: error
    - name: Publish tagged Windows release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: ${{ env.IS_PRERELEASE == 'true' && format('v{0} Pre-Release preliminar', env.NUMERIC_VERSION) || github.ref_name }}
        prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'true' }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: 'Installer/output/*.exe

          Installer/output/*.sha256'
