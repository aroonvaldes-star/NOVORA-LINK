name: NOVORA CI

on:
  push:
    branches:
      - "NOVORA-LINK"
      - "restructure/**"
      - "release/**"
      - "audit/**"
      - "policy/**"
  pull_request:
    branches:
      - "NOVORA-LINK"

permissions:
  contents: read

jobs:
  relay:
    name: Rust relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test locked relay dependencies
        run: cargo test --locked --manifest-path src/NOVORA/LinkEngine/Network/Native/RelayCore/Cargo.toml
      - name: Build release relay
        run: cargo build --release --locked --manifest-path src/NOVORA/LinkEngine/Network/Native/RelayCore/Cargo.toml

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            ".\scripts\Setup-Tools.ps1",
            ".\scripts\Prepare-ThirdPartyCompliance.ps1",
            ".\scripts\Configure-GitHubRulesets.ps1"
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell inválido: $script"
            }
          }

      - name: Restore verified runtime tools
        shell: pwsh
        run: .\scripts\Setup-Tools.ps1

      - name: Restore Android workload
        shell: pwsh
        run: dotnet workload restore .\src\NOVORA.Android\NLProjectAndroid.csproj

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\NOVORA.sln
          if ($LASTEXITCODE -ne 0) { throw "Falló la restauración de NOVORA." }
          dotnet restore .\tests\NOVORA.Tests\NLProjectTests.csproj
          if ($LASTEXITCODE -ne 0) { throw "Falló la restauración de pruebas." }

      - name: Build
        shell: pwsh
        run: |
          dotnet build .\src\NOVORA\NLProjectDesktop.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación Release de NOVORA PC." }

          dotnet build .\src\NOVORA.Android\NLProjectAndroid.csproj -c Release -t:Compile --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación de código Android." }

          dotnet build .\tests\NOVORA.Tests\NLProjectTests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación de pruebas." }

      - name: Test
        run: dotnet run --project .\tests\NOVORA.Tests\NLProjectTests.csproj -c Release --no-build --no-restore
