name: DevSkim

on:
  push:
    branches:
      - "NOVORA-LINK"
  pull_request:
    branches:
      - "NOVORA-LINK"
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  devskim:
    name: devskim
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DevSkim
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6
        with:
          directory-to-scan: .
          should-scan-archives: false
          output-filename: devskim-results.sarif
          ignore-globs: "**/.git/**,**/bin/**,**/obj/**,**/artifacts/**,**/Installer/output/**"

      - name: Upload SARIF
        if: always() && hashFiles('devskim-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif
