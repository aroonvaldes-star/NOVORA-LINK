name: CodeQL
'on':
  push:
    branches:
    - NOVORA-LINK
    - release/**
  pull_request:
    branches:
    - NOVORA-LINK
  schedule:
  - cron: 23 5 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: csharp
          runner: windows-latest
          build_mode: manual
        - language: actions
          runner: ubuntu-latest
          build_mode: none
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build_mode }}
        queries: security-extended
    - name: Setup .NET 8 and 10
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x

          10.0.x

          '
    - name: Restore verified runtime tools
      if: matrix.language == 'csharp'
      shell: pwsh
      run: .\scripts\Setup-Tools.ps1
    - name: Restore Android workload
      if: matrix.language == 'csharp'
      shell: pwsh
      run: dotnet workload restore .\src\NOVORA.Android\NLProjectAndroid.csproj
    - name: Restore
      if: matrix.language == 'csharp'
      shell: pwsh
      run: 'dotnet restore src/NOVORA/NLProjectDesktop.csproj

        if ($LASTEXITCODE -ne 0) { throw "Restore failed." }'
    - name: Build
      if: matrix.language == 'csharp'
      shell: pwsh
      run: 'dotnet build src/NOVORA/NLProjectDesktop.csproj -c Release --no-restore

        if ($LASTEXITCODE -ne 0) { throw "Windows build failed." }

        dotnet build src/NOVORA.Android/NLProjectAndroid.csproj -c Release -r android-arm64 -t:Compile -p:AndroidBuildApplicationPackage=false

        if ($LASTEXITCODE -ne 0) { throw "Android compile failed." }'
    - name: Analyze
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: /language:${{ matrix.language }}
