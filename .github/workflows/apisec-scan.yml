name: APIsec Scan

on:
  schedule:
    - cron: "29 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  apisec:
    name: apisec
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APISEC_USERNAME: ${{ secrets.APISEC_USERNAME }}
      APISEC_PASSWORD: ${{ secrets.APISEC_PASSWORD }}
      APISEC_PROJECT: ${{ vars.APISEC_PROJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check APIsec configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$APISEC_USERNAME" || -z "$APISEC_PASSWORD" || -z "$APISEC_PROJECT" ]]; then
            echo "APIsec no está configurado. Define secrets APISEC_USERNAME/APISEC_PASSWORD y variable APISEC_PROJECT."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Run APIsec scan
        if: steps.config.outputs.enabled == 'true'
        uses: apisec-inc/apisec-run-scan@8f66ce948afb779712a1d57ecb0a528d7ded5a45
        with:
          apisec-username: ${{ secrets.APISEC_USERNAME }}
          apisec-password: ${{ secrets.APISEC_PASSWORD }}
          apisec-project: ${{ vars.APISEC_PROJECT }}
          sarif-result-file: apisec-results.sarif
          apisec-fail-on-vuln-severity: High

      - name: Upload SARIF
        if: always() && steps.config.outputs.enabled == 'true' && hashFiles('apisec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apisec-results.sarif
